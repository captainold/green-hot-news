<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Hot News · 绿色低碳动态雷达</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌿</text></svg>" />
    <link rel="stylesheet" href="./assets/styles.css?v=3" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-main">
          <div class="hero-headline">
            <span class="hero-logo">🌿</span>
            <div>
              <p class="hero-tag">GREEN LOW-CARBON INTELLIGENCE</p>
              <h1>绿色低碳动态雷达</h1>
            </div>
          </div>
          <p class="hero-sub">
            政策 · 技术 · 金融 · AI科技 四维覆盖 · 评分排行榜
          </p>
        </div>
        <div class="hero-meta">
          <span class="updated-label">更新时间</span>
          <span class="updated" id="updatedAt">加载中...</span>
        </div>

        <section class="stats" id="stats"></section>
      </header>

      <section class="primary-controls">
        <input id="searchInput" type="search" placeholder="搜索动态 / 来源 / 关键词" />
        <button id="digestBtn" class="digest-btn" type="button" title="A 级以上高分动态浓缩版，可直接转发">📋 当日浓缩</button>
        <span class="mode-hint" id="modeHint">绿色动态</span>
      </section>

      <!-- 区域一：排行榜（主题 × 周期 × 区域） -->
      <section class="board board-rank">
        <div class="board-head">
          <div class="board-title">
            <span class="board-icon">🏆</span>
            <h2>排行榜</h2>
            <span class="board-sub" id="rankSub">全部 · 国际 · 日</span>
          </div>
          <span class="board-count" id="rankCount">0 条</span>
        </div>
        <div class="rank-filters">
          <div class="field">
            <span class="filter-label">主题</span>
            <div class="mode-switch" id="topicSwitch"></div>
          </div>
          <div class="field">
            <span class="filter-label">周期</span>
            <div class="mode-switch" id="periodSwitch"></div>
          </div>
          <div class="field">
            <span class="filter-label">区域</span>
            <div class="mode-switch" id="regionSwitch"></div>
          </div>
        </div>
        <div class="board-body" id="rankList"></div>
      </section>

      <!-- 区域二：时间线（跟随上方筛选，新条目自动插入滚动） -->
      <section class="board board-timeline">
        <div class="board-head">
          <div class="board-title">
            <span class="board-icon">⏱️</span>
            <h2>时间线</h2>
            <span class="board-sub" id="tlSub">跟随排行榜筛选 · 新→旧</span>
          </div>
          <div class="timeline-controls">
            <span class="live-pill" id="livePill" title="服务器每 30 分钟抓取，页面每 60 秒轮询新条目">🟢 实时</span>
            <button id="tlPauseBtn" class="mode-btn" type="button">⏸ 暂停</button>
            <button id="tlTopBtn" class="new-arrival-btn" type="button" hidden>✨ 有新条目 · 回到最新</button>
          </div>
        </div>
        <div class="board-body" id="tlList"></div>
        <button id="tlMoreBtn" class="load-more" type="button" hidden>加载更早</button>
      </section>

      <details class="advanced-panel">
        <summary>
          <span>高级筛选与源状态</span>
          <span class="advanced-summary" id="advancedSummary">加载中...</span>
        </summary>
        <div class="advanced-content">
          <div class="advanced-controls">
            <label class="field">
              <span>站点</span>
              <select id="siteSelect">
                <option value="">全部站点</option>
              </select>
            </label>
            <div class="field">
              <span>模式</span>
              <div class="mode-switch">
                <button id="modeGreenBtn" class="mode-btn active" type="button">绿色动态</button>
                <button id="modeAllBtn" class="mode-btn" type="button">全量</button>
              </div>
            </div>
          </div>
          <div class="source-health" id="sourceHealth">源状态加载中...</div>
          <section class="site-pills" id="sitePills"></section>
        </div>
      </details>
    </main>

    <!-- 当日高分浓缩弹窗（2026-08-17） -->
    <div class="modal-mask" id="digestMask" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-label="当日高分浓缩">
        <div class="modal-head">
          <h3>📋 当日高分浓缩</h3>
          <span class="modal-sub">A 级以上（评分 ≥ 70）· 四维精选 · 可直接转发</span>
          <button id="digestClose" class="modal-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body">
          <pre id="digestContent" class="digest-content">加载中...</pre>
        </div>
        <div class="modal-foot">
          <button id="digestCopy" class="digest-copy" type="button">📄 复制全文</button>
          <span class="digest-hint">复制后可直接转发微信群 / 朋友圈 / 自媒体</span>
        </div>
      </div>
    </div>

    <template id="itemTpl">
      <article class="news-card">
        <div class="card-top">
          <span class="score-badge" title=""></span>
          <span class="dim-tag" title="四维分类"></span>
          <div class="meta-row">
            <span class="site"></span>
            <time class="time"></time>
          </div>
        </div>
        <a class="title" target="_blank" rel="noopener noreferrer"></a>
        <span class="title-orig" hidden></span>
        <button class="summary-toggle" type="button" hidden>摘要</button>
        <p class="summary" hidden></p>
      </article>
    </template>

    <script src="./assets/app.js?v=3" defer></script>
  </body>
</html>
