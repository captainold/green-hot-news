<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Hot News · 绿色低碳动态雷达</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌿</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=13" />
    <script>
      // 主题预加载（2026-08-19）：在 CSS 应用前设置 data-theme，防闪白/闪黑。
      (function () {
        try {
          var t = localStorage.getItem("ghn-theme");
          if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-main">
          <div class="hero-headline">
            <span class="hero-logo">🌿</span>
            <div>
              <p class="hero-tag">GREEN LOW-CARBON INTELLIGENCE</p>
              <h1>绿色低碳动态雷达</h1>
            </div>
          </div>
          <p class="hero-sub">政策 · 产业 · 市场信号 · AI 四维覆盖 · 主题标签关系图谱</p>
        </div>
        <div class="hero-meta">
          <span class="updated-label">更新时间</span>
          <span class="updated" id="updatedAt">加载中...</span>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            title="日间 / 夜间护眼模式切换"
            aria-label="切换日间/夜间模式"
          >🌙</button>
        </div>
      </header>

      <!-- 区域一：顶部控制（选择主题·四维 · 时间段 · 一键复制） -->
      <section class="board board-controls">
        <div class="controls-row">
          <div class="field">
            <span class="filter-label">主题</span>
            <div class="mode-switch" id="topicSwitch"></div>
          </div>
          <div class="field">
            <span class="filter-label">时间段</span>
            <div class="mode-switch" id="periodSwitch"></div>
          </div>
          <div class="field">
            <span class="filter-label">区域</span>
            <div class="mode-switch" id="regionSwitch"></div>
          </div>
          <div class="field field-search">
            <span class="filter-label">搜索</span>
            <div class="search-box">
              <input type="text" id="searchInput" class="search-input" placeholder="支持 Obsidian 语法：tag:储能 path:产业" autocomplete="off" />
              <button type="button" id="searchClear" class="search-clear" hidden>✕</button>
            </div>
          </div>
          <div class="controls-spacer"></div>
          <button id="copyBtn" class="copy-btn" type="button" title="复制当前主题 × 时间段内的文字版概要（含网站宣传）">
            📋 一键复制概要
          </button>
        </div>
      </section>

      <!-- 区域二：中部列表（两种排序 · 每页条数可选 · 紧凑分页） -->
      <section class="board board-list">
        <div class="board-head">
          <div class="board-title">
            <span class="board-icon">📰</span>
            <h2>动态</h2>
            <span class="board-sub" id="listSub"></span>
          </div>
          <div class="list-controls">
            <div class="mode-switch" id="sortSwitch"></div>
            <label class="page-size">
              <span>每页</span>
              <select id="pageSizeSelect">
                <option value="10">10 条</option>
                <option value="20" selected>20 条</option>
                <option value="50">50 条</option>
              </select>
            </label>
          </div>
        </div>
        <div class="board-body" id="listBody"></div>
        <div class="pager" id="pager" hidden>
          <button id="prevPage" class="pager-btn" type="button">‹ 上一页</button>
          <span class="pager-info" id="pagerInfo"></span>
          <button id="nextPage" class="pager-btn" type="button">下一页 ›</button>
        </div>
      </section>

      <!-- 区域三：底部趋势（关系图谱——主题标签共现） -->
      <section class="board board-graph">
        <div class="board-head">
          <div class="board-title">
            <span class="board-icon">🕸️</span>
            <h2>主题关系图谱</h2>
            <span class="board-sub" id="graphSub"></span>
          </div>
          <span class="board-count" id="graphCount"></span>
        </div>
        <div class="board-body">
          <div id="graphChart" class="graph-chart" style="height: 420px"></div>
        </div>
      </section>
    </main>

    <template id="itemTpl">
      <article class="news-card">
        <div class="card-top">
          <span class="rank-num" hidden></span>
          <span class="score-badge" title=""></span>
          <span class="dim-tag" title="四维分类"></span>
          <div class="meta-row">
            <span class="site"></span>
            <time class="time"></time>
          </div>
        </div>
        <a class="title" target="_blank" rel="noopener noreferrer"></a>
        <span class="title-orig" hidden></span>
        <div class="topic-chips"></div>
        <button class="summary-toggle" type="button" hidden>展开摘要</button>
        <p class="summary" hidden></p>
      </article>
    </template>

    <script src="./assets/echarts.min.js" defer></script>
    <script src="./assets/app.js?v=25" defer></script>
  </body>
</html>
