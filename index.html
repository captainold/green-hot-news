<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Hot News · 绿色低碳动态雷达</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌿</text></svg>" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-main">
          <div class="hero-headline">
            <span class="hero-logo">🌿</span>
            <div>
              <p class="hero-tag">GREEN LOW-CARBON INTELLIGENCE</p>
              <h1>绿色低碳动态雷达</h1>
            </div>
          </div>
          <p class="hero-sub">
            国内外最新绿色低碳政策动态 · 官方新闻与媒体评论双栏展示
          </p>
        </div>
        <div class="hero-meta">
          <span class="updated-label">更新时间</span>
          <span class="updated" id="updatedAt">加载中...</span>
        </div>

        <section class="stats" id="stats"></section>
      </header>

      <section class="primary-controls">
        <input id="searchInput" type="search" placeholder="搜索政策信号 / 来源 / 关键词" />
        <div class="mode-hint" id="modeHint">绿色政策</div>
      </section>

      <section class="score-bar" id="scoreBar">
        <div class="score-bar-left">
          <span class="score-bar-label">分数徽章</span>
          <div class="level-switch" id="levelSwitch">
            <button class="level-btn active" data-level="" type="button">全部</button>
            <button class="level-btn" data-level="S" type="button">S</button>
            <button class="level-btn" data-level="A" type="button">A</button>
            <button class="level-btn" data-level="B" type="button">B</button>
            <button class="level-btn" data-level="C" type="button">C</button>
            <button class="level-btn" data-level="D" type="button">D</button>
          </div>
        </div>
        <div class="score-bar-right">
          <span class="score-bar-label">排序</span>
          <div class="mode-switch">
            <button id="sortScoreBtn" class="mode-btn active" type="button">按分数</button>
            <button id="sortTimeBtn" class="mode-btn" type="button">按时间</button>
          </div>
        </div>
      </section>

      <details class="advanced-panel">
        <summary>
          <span>高级筛选与源状态</span>
          <span class="advanced-summary" id="advancedSummary">加载中...</span>
        </summary>
        <div class="advanced-content">
          <div class="advanced-controls">
            <label class="field">
              <span>站点</span>
              <select id="siteSelect">
                <option value="">全部站点</option>
              </select>
            </label>
            <div class="field">
              <span>视图</span>
              <div class="mode-switch">
                <button id="modeGreenBtn" class="mode-btn active" type="button">绿色政策</button>
                <button id="modeAllBtn" class="mode-btn" type="button">全量</button>
              </div>
            </div>
          </div>
          <div class="source-health" id="sourceHealth">源状态加载中...</div>
          <section class="site-pills" id="sitePills"></section>
        </div>
      </details>

      <!-- 双栏：官方新闻（政策库）｜媒体新闻（媒体库） -->
      <section class="dual-list">
        <section class="col col-policy">
          <div class="col-head">
            <div class="col-title">
              <span class="col-icon">🏛️</span>
              <h2>官方新闻</h2>
              <span class="col-sub">政府 · 国际组织 · 官方解读</span>
            </div>
            <div class="col-meta">
              <span class="col-count" id="policyCount">0 条</span>
              <button class="col-toggle" type="button" data-target="policyList" aria-expanded="true">收起</button>
            </div>
          </div>
          <div class="col-body" id="policyList"></div>
        </section>

        <section class="col col-media">
          <div class="col-head">
            <div class="col-title">
              <span class="col-icon">📰</span>
              <h2>媒体新闻</h2>
              <span class="col-sub">报刊 · 公众号 · 全网热点</span>
            </div>
            <div class="col-meta">
              <span class="col-count" id="mediaCount">0 条</span>
              <button class="col-toggle" type="button" data-target="mediaList" aria-expanded="true">收起</button>
            </div>
          </div>
          <div class="col-body" id="mediaList"></div>
        </section>
      </section>
    </main>

    <template id="itemTpl">
      <article class="news-card">
        <div class="card-top">
          <span class="score-badge" title=""></span>
          <div class="meta-row">
            <span class="site"></span>
            <time class="time"></time>
          </div>
        </div>
        <a class="title" target="_blank" rel="noopener noreferrer"></a>
        <button class="summary-toggle" type="button" hidden>摘要</button>
        <p class="summary" hidden></p>
      </article>
    </template>

    <script src="./assets/app.js" defer></script>
  </body>
</html>
