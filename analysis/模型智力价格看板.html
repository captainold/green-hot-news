  const s = n.toLowerCase();
  if (s.includes('claude') || s.includes('anthropic')) return 'Anthropic';
  if (s.includes('gpt') || s.includes('openai')) return 'OpenAI';
  if (s.includes('grok')) return 'xAI';

  if (s.includes('qwen')) return 'Alibaba';
  if (s.includes('gemini') || s.includes('google')) return 'Google';
  if (s.includes('deepseek')) return 'DeepSeek';

  if (s.includes('mistral')) return 'Mistral';
  if (s.includes('nemotron') || s.includes('nvidia')) return 'NVIDIA';
